name: Build Eyespie iOS MediaPipe Pods

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ios-mediapipe-pods-0.10.24
    tags:
      - eyespie-ios-v*

permissions:
  contents: read

concurrency:
  group: eyespie-ios-mediapipe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      VERSION: 0.10.24.1
      POD_RELEASE_TAG: eyespie-ios-v0.10.24.1

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify v0.10.24 baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(git rev-list -n 1 v0.10.24)"
          merge_base="$(git merge-base HEAD v0.10.24)"
          test "${merge_base}" = "${baseline}"

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version

      - name: Install Bazelisk and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          brew install bazelisk cocoapods
          bazelisk version
          pod --version

      - name: Build Common and Vision archives
        shell: bash
        run: bash distribution/ios/build_eyespie_pods.sh

      - name: Validate checksums and archive layout
        shell: bash
        run: |
          set -euo pipefail
          cd dist/ios-pods
          shasum -a 256 --check SHA256SUMS
          for archive in ./*.tar.gz; do
            tar -tzf "${archive}" | grep -E 'LICENSE|\.xcframework|graph_libraries'
          done

      - name: Validate podspec syntax
        shell: bash
        run: |
          set -euo pipefail
          POD_VERSION="${VERSION}" POD_RELEASE_TAG="${POD_RELEASE_TAG}" \
            pod ipc spec distribution/ios/MediaPipeTasksCommon.podspec >/tmp/MediaPipeTasksCommon.podspec.json
          POD_VERSION="${VERSION}" POD_RELEASE_TAG="${POD_RELEASE_TAG}" \
            pod ipc spec distribution/ios/MediaPipeTasksVision.podspec >/tmp/MediaPipeTasksVision.podspec.json

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-ios-${{ env.VERSION }}
          path: |
            dist/ios-pods/*.tar.gz
            dist/ios-pods/SHA256SUMS
            dist/ios-pods/provenance.txt
            distribution/ios/*.podspec
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/eyespie-ios-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: mediapipe-ios-0.10.24.1
          path: release

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "MediaPipe iOS 0.10.24.1 for Eyespie" \
            --notes "MediaPipeTasksCommon and MediaPipeTasksVision built from upstream v0.10.24." \
            release/*

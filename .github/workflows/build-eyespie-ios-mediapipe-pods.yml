name: Build Eyespie iOS MediaPipe Pods

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-eyespie-ios-mediapipe-pods.yml"
      - "distribution/ios/**"
  push:
    branches:
      - master
      - agent/ios-mediapipe-pods-0.10.26
    tags:
      - "eyespie-ios-v0.10.26.1"

permissions:
  contents: read

concurrency:
  group: eyespie-ios-mediapipe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-consume:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      VERSION: 0.10.26.1
      POD_RELEASE_TAG: eyespie-ios-v0.10.26.1

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and release contract
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(git rev-list -n 1 v0.10.26)"
          merge_base="$(git merge-base HEAD v0.10.26)"
          test "${merge_base}" = "${baseline}"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "${POD_RELEASE_TAG}"
          fi

      - name: Capture Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun clang --version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          ruby --version
          df -h

      - name: Install Bazelisk and CocoaPods
        shell: bash
        run: |
          set -euo pipefail
          brew install bazelisk cocoapods
          bazelisk version
          bazel --version
          pod --version

      - name: Build Common, Vision, GenAIC, and GenAI
        shell: bash
        run: bash distribution/ios/build_eyespie_pods.sh

      - name: Validate checksums and exact archive contents
        shell: bash
        run: |
          set -euo pipefail
          cd dist/ios-pods
          shasum -a 256 --check SHA256SUMS

          rm -rf /tmp/mediapipe-pod-validation
          mkdir -p /tmp/mediapipe-pod-validation

          for framework in MediaPipeTasksCommon MediaPipeTasksVision MediaPipeTasksGenAIC MediaPipeTasksGenAI; do
            root="/tmp/mediapipe-pod-validation/${framework}"
            mkdir -p "${root}"
            tar -xzf "${framework}-${VERSION}.tar.gz" -C "${root}"
            test -f "${root}/LICENSE"
            test -d "${root}/frameworks/${framework}.xcframework"
            plutil -lint "${root}/frameworks/${framework}.xcframework/Info.plist"
            grep -q "ios-arm64" "${root}/frameworks/${framework}.xcframework/Info.plist"
            grep -Eq "ios-arm64_x86_64-simulator|ios-arm64-simulator|ios-x86_64-simulator" \
              "${root}/frameworks/${framework}.xcframework/Info.plist"
          done

          test -f /tmp/mediapipe-pod-validation/MediaPipeTasksCommon/frameworks/graph_libraries/libMediaPipeTasksCommon_simulator_graph.a
          test -f /tmp/mediapipe-pod-validation/MediaPipeTasksCommon/frameworks/graph_libraries/libMediaPipeTasksCommon_device_graph.a
          test -f /tmp/mediapipe-pod-validation/MediaPipeTasksGenAIC/frameworks/genai_libraries/libMediaPipeTasksGenAIC_simulator.a
          test -f /tmp/mediapipe-pod-validation/MediaPipeTasksGenAIC/frameworks/genai_libraries/libMediaPipeTasksGenAIC_device.a

          lipo -info /tmp/mediapipe-pod-validation/MediaPipeTasksCommon/frameworks/graph_libraries/libMediaPipeTasksCommon_simulator_graph.a
          lipo -info /tmp/mediapipe-pod-validation/MediaPipeTasksCommon/frameworks/graph_libraries/libMediaPipeTasksCommon_device_graph.a
          lipo -info /tmp/mediapipe-pod-validation/MediaPipeTasksGenAIC/frameworks/genai_libraries/libMediaPipeTasksGenAIC_simulator.a
          lipo -info /tmp/mediapipe-pod-validation/MediaPipeTasksGenAIC/frameworks/genai_libraries/libMediaPipeTasksGenAIC_device.a

      - name: Validate podspec serialization
        shell: bash
        run: |
          set -euo pipefail
          for podspec in distribution/ios/*.podspec; do
            POD_VERSION="${VERSION}" POD_RELEASE_TAG="${POD_RELEASE_TAG}" \
              pod ipc spec "${podspec}" >/tmp/"$(basename "${podspec}")".json
          done

      - name: Lint and link candidate pods from local archives
        shell: bash
        run: |
          set -euo pipefail

          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist/ios-pods \
            >/tmp/mediapipe-pod-http.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true; cat /tmp/mediapipe-pod-http.log || true' EXIT

          base_url="http://127.0.0.1:8765"
          curl --fail --silent --show-error \
            "${base_url}/MediaPipeTasksCommon-${VERSION}.tar.gz" >/dev/null

          common="distribution/ios/MediaPipeTasksCommon.podspec"
          vision="distribution/ios/MediaPipeTasksVision.podspec"
          genaic="distribution/ios/MediaPipeTasksGenAIC.podspec"
          genai="distribution/ios/MediaPipeTasksGenAI.podspec"

          POD_VERSION="${VERSION}" POD_RELEASE_TAG="${POD_RELEASE_TAG}" POD_SOURCE_BASE_URL="${base_url}" \
            pod spec lint "${common}" --allow-warnings --verbose

          POD_VERSION="${VERSION}" POD_RELEASE_TAG="${POD_RELEASE_TAG}" POD_SOURCE_BASE_URL="${base_url}" \
            pod spec lint "${vision}" --include-podspecs="${common}" --allow-warnings --verbose

          POD_VERSION="${VERSION}" POD_RELEASE_TAG="${POD_RELEASE_TAG}" POD_SOURCE_BASE_URL="${base_url}" \
            pod spec lint "${genaic}" --allow-warnings --verbose

          POD_VERSION="${VERSION}" POD_RELEASE_TAG="${POD_RELEASE_TAG}" POD_SOURCE_BASE_URL="${base_url}" \
            pod spec lint "${genai}" --include-podspecs="${genaic}" --allow-warnings --verbose

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediapipe-ios-${{ env.VERSION }}
          path: |
            dist/ios-pods/*.tar.gz
            dist/ios-pods/SHA256SUMS
            dist/ios-pods/provenance.txt
            distribution/ios/*.podspec
          if-no-files-found: error
          retention-days: 14

      - name: Block tag publication pending Eyespie KMP gate
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          echo "Release publication is intentionally disabled until the Eyespie KMP consumer/link gate is implemented." >&2
          exit 1
